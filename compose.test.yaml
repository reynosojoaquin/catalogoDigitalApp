name: catalogo-digital-test

services:
  db:
    image: postgres:17.11-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [data]

  redis:
    image: redis:7.4.10-alpine3.21
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]

  backend:
    image: catalogo-digital-backend:${APP_VERSION:-test}
    build:
      context: ./backend
      target: development
    env_file: ${ENV_FILE:-.env.test}
    environment:
      APP_ENV: test
      DJANGO_DEBUG: "false"
    command: ["python", "manage.py", "test"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [data]

networks:
  data:
    internal: true
