name: Catalogo Digital CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    env:
      ENV_FILE: .env.test.example
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Scan tracked files for secrets
        shell: bash
        run: |
          if git grep -n -I -E 'BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9]{20,}' -- . ':(exclude)*.example'; then
            echo "Potential secret detected in tracked files."
            exit 1
          fi
      - name: Validate Compose files
        run: |
          docker compose --env-file .env.test.example -f compose.test.yaml config --quiet
          ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f compose.production.yaml config --quiet
      - name: Check committed migrations
        run: docker compose --env-file .env.test.example -f compose.test.yaml run --rm --no-deps backend python manage.py makemigrations --check --dry-run
      - name: Check production security settings
        run: ENV_FILE=.env.production.example docker compose --env-file .env.production.example -f compose.production.yaml run --rm --no-deps backend python manage.py check --deploy
      - name: Run backend tests with PostgreSQL and Redis
        run: docker compose --env-file .env.test.example -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from backend
      - name: Stop test services
        if: always()
        run: docker compose --env-file .env.test.example -f compose.test.yaml down --volumes

  android:
    name: Android JVM, lint and APK
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run JVM tests, lint and build artifacts
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease

  android-instrumented:
    name: Android Room migrations on emulator
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "emulator"
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          script: cd android && ./gradlew connectedDebugAndroidTest
